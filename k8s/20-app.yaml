apiVersion: apps/v1
kind: Deployment
metadata:
  name: countryinfo
  namespace: countryinfo
  labels:
    app: countryinfo
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: countryinfo
  template:
    metadata:
      labels:
        app: countryinfo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 3; done"]
      containers:
        - name: countryinfo
          image: countryinfo:1.0.0   # replace with <registry>/countryinfo:<tag>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: countryinfo-config }
          env:
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: countryinfo-db, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: countryinfo-db, key: DB_PASSWORD } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: countryinfo
  namespace: countryinfo
spec:
  type: ClusterIP
  selector:
    app: countryinfo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: countryinfo
  namespace: countryinfo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: countryinfo
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: countryinfo
  namespace: countryinfo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: countryinfo
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: countryinfo
  namespace: countryinfo
spec:
  ingressClassName: nginx
  rules:
    - host: countryinfo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: countryinfo
                port: { name: http }
