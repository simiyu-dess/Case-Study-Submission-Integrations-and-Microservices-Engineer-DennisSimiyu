spring:
  application:
    name: countryinfo
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/countryinfo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  cache:
    cache-names: isoCodes,fullCountryInfo
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

countryinfo:
  soap:
    endpoint: ${SOAP_ENDPOINT:http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso}
    connect-timeout: ${SOAP_CONNECT_TIMEOUT:3s}
    read-timeout: ${SOAP_READ_TIMEOUT:5s}
    max-attempts: ${SOAP_MAX_ATTEMPTS:3}
    initial-backoff: ${SOAP_INITIAL_BACKOFF:200ms}
    circuit-failure-threshold: ${SOAP_CB_FAILURE_THRESHOLD:5}
    circuit-open-duration: ${SOAP_CB_OPEN_DURATION:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    io.github.dennissimiyu: ${APP_LOG_LEVEL:INFO}
    # Set to DEBUG to log full SOAP request/response payloads when troubleshooting.
    io.github.dennissimiyu.countryinfo.client: ${SOAP_LOG_LEVEL:INFO}
